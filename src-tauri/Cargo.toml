[package]
name = "z-reader"
version = "0.1.2"
description = "Modern desktop RSS reader (Fluent Reader rebuild in Tauri 2)"
authors = ["z-reader"]
edition = "2021"

[lib]
name = "zreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
feed-rs = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tokio = { version = "1", features = ["time", "macros"] }
opml = "1"
ammonia = "4"
dom_smoothie = "0.4"
scraper = "0.23"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
log = "0.4"
base64 = "0.22"

[profile.release]
opt-level = "s"          # 体积优先
lto = "fat"              # 全程序链接时优化
codegen-units = 1        # 单 codegen 单元，最大化内联/消除
strip = "symbols"        # 剥离符号表
panic = "abort"          # 无 unwinding，减小体积

